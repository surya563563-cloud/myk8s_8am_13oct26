apiVersion : v1
kind : ReplicationController
metadata:
   name : myjavaapp-rc
spec:
  replicas: 2
  selector:
       app: myapp
       version: 2.6.1
  template:
     metadata:
        labels: 
          app: myapp
          version: 2.6.1
  spec:
    containers:
    - name: myjavacontainer 
      image: suryamekala/myonlinebooking
      ports:
      - containerPort: 8080    
