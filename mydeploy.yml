
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myjavaapp-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myjavaapp
  template:
    metadata:
      labels:
        app: myjavaapp
    spec:
      containers:
      - name: myjavaapp-container
        image: 790281820597.dkr.ecr.us-east-2.amazonaws.com/myjavaapp:1
        ports:
        - containerPort: 8080
